# Ruff configuration for every Python demo in this repository.
# Run from the repository root: ruff check .   (or: npm run lint:py)
target-version = "py311"
line-length = 120
# Each demo folder holds its own local modules, so import sorting groups them as first-party.
src = ["*"]
extend-exclude = ["**/.venv"]

[lint]
# pycodestyle errors and warnings, Pyflakes, import order, bugbear (likely bugs), pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
  "E501",  # long lines: demos print aligned tables on one line
  "B905",  # zip() without strict=: lists zipped in demos are built to the same length
]
